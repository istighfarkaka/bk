    function urutkanDaftarKelas(arrKelas) {
      const bobotTingkat = (nama) => {
        const u = String(nama).toUpperCase();
        if (u.startsWith("XII")) return 3;
        if (u.startsWith("XI")) return 2;
        if (u.startsWith("X")) return 1;
        return 4;
      };
      return arrKelas.sort((a, b) => {
        const itemA = typeof a === 'object' ? a.nama_kelas : a;
        const itemB = typeof b === 'object' ? b.nama_kelas : b;
        const bA = bobotTingkat(itemA);
        const bB = bobotTingkat(itemB);
        if (bA !== bB) return bA - bB;
        return itemA.localeCompare(itemB, undefined, { numeric: true, sensitivity: 'base' });
      });
    }

    function hitungKelasTujuan(kelasAwal) {
      if (!kelasAwal) return "-";
      const parts = kelasAwal.trim().split(" ");
      if (parts[0] === "X") parts[0] = "XI";
      else if (parts[0] === "XI") parts[0] = "XII";
      return parts.join(" ");
    }

    function formatWaktuIndo(isoString) {
      if (!isoString) return "Belum Ditentukan";
      try {
        const d = new Date(isoString);
        const hari = ["Minggu", "Senin", "Selasa", "Rabu", "Kamis", "Jumat", "Sabtu"][d.getDay()];
        const bulan = ["Januari", "Februari", "Maret", "April", "Mei", "Juni", "Juli", "Agustus", "September", "Oktober", "November", "Desember"][d.getMonth()];
        const jam = String(d.getHours()).padStart(2, '0');
        const menit = String(d.getMinutes()).padStart(2, '0');
        return `${hari}, ${d.getDate()} ${bulan} ${d.getFullYear()} Pukul ${jam}:${menit} WIB`;
      } catch(e) { return isoString; }
    }

    function ekstraksiFolderIdDrive(str) {
      if (!str) return "";
      str = str.trim();
      if (str.includes("drive.google.com")) {
        const match = str.match(/folders\/([a-zA-Z0-9_-]+)/);
        if (match && match[1]) return match[1];
      }
      return str;
    }

        loading.style.display = "none";
        btn.disabled = false;

        return;
      }

      try {
        const q = query(collection(db, "users"), where("username", "==", usernameInput), where("password", "==", passwordInput));
        const querySnapshot = await getDocs(q);

        loading.style.display = "none";
        btn.disabled = false;

        } else {
          err.innerText = "Username atau Password salah!";

        err.innerText = "Gagal terhubung ke database: " + error.message;
      }
    };

    async function eksekusiBackupKelasKeDriveViaGAS(namaKelas) {
      const rawUrlDrive = document.getElementById("input-backup-drive-url").value.trim();
      const parentFolderId = ekstraksiFolderIdDrive(rawUrlDrive);
      const gasUrl = document.getElementById("input-backup-gas-url").value.trim();

      if (!parentFolderId || !gasUrl) {
        alert("Silakan lengkapi ID Folder Drive dan URL Web App Google Apps Script terlebih dahulu!");
        return;
      }

      const boxStatus = document.getElementById("status-backup-progress");
      const txtStatus = document.getElementById("text-backup-status");
      const barFill = document.getElementById("bar-backup-fill");

      boxStatus.style.display = "block";
      txtStatus.innerText = `🔍 Mengambil data Rapor siswa kelas "${namaKelas}"...`;
      barFill.style.width = `5%`;
      barFill.innerText = `5%`;

      try {
        const qSiswa = query(collection(db, "users"), where("role", "==", "siswa"), where("kelas", "==", namaKelas));
        const snapSiswa = await getDocs(qSiswa);
        
        let listSiswa = [];
        snapSiswa.forEach(d => listSiswa.push(d.data()));
        listSiswa.sort((a,b) => a.nama.localeCompare(b.nama, undefined, { sensitivity: 'base' }));

        if(listSiswa.length === 0) {
          alert(`Tidak ada siswa terdaftar pada kelas ${namaKelas}`);
          boxStatus.style.display = "none";
          return;
        }

        txtStatus.innerText = `📦 Mulai mengirim Rapor Siswa Kelas ${namaKelas} ke Google Drive...`;

        let total = listSiswa.length;
        let completed = 0;

        for (let s of listSiswa) {
          completed++;
          const pct = Math.round((completed / total) * 100);
          txtStatus.innerText = `⚙️ Mengirim Rapor PDF (${completed}/${total}): ${s.nama}...`;
          barFill.style.width = `${pct}%`;
          barFill.innerText = `${pct}%`;

          const htmlRaporSiswa = await buatHtmlRaporSiswa(s);
          
          const safeNama = s.nama.replace(/[^a-zA-Z0-9 ]/g, "").replace(/\s+/g, "_");
          const fileName = `Rapor_${namaKelas.replace(/\s+/g, "_")}_${safeNama}.pdf`;

          const payload = {
            folderId: parentFolderId,
            subFolder: namaKelas,
            fileName: fileName,
            htmlContent: htmlRaporSiswa
          };

          await fetch(gasUrl, {
            method: 'POST',
            mode: 'no-cors',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
          });
        }

        txtStatus.innerText = `✅ SUKSES! Seluruh Rapor Kelas ${namaKelas} (${total} PDF) telah diunggah ke Drive!`;
        alert(`Backup Kelas ${namaKelas} Selesai!\nSeluruh file Rapor PDF berhasil diunggah ke Sub-Folder "${namaKelas}" di Google Drive Anda.`);
      } catch (err) {
        alert("Terjadi kesalahan saat memproses backup: " + err.message);
        txtStatus.innerText = "❌ Backup gagal: " + err.message;
      }
    }

    /* PANEL WALI KELAS & KEPUTUSAN KENAIKAN */
    async function muatTabelWaliKelasSiswa() {
      const tbody = document.getElementById("tabel-walikelas-siswa-body");
      const thKeputusan = document.getElementById("th-walikelas-keputusan");
      if (!tbody) return;

      if (!kelasBinaanAktif) {
        tbody.innerHTML = '<tr><td colspan="7" style="text-align:center; color:#ef4444; padding:15px;">Pilih kelas terlebih dahulu.</td></tr>';
        return;
      }

      const isGenap = (dataSekolahGlobal.semester_aktif || "Ganjil").toLowerCase() === "genap";
      if (thKeputusan) thKeputusan.style.display = isGenap ? "table-cell" : "none";

      updateLabelKelasExcel(kelasBinaanAktif);
      tbody.innerHTML = '<tr><td colspan="7" style="text-align:center;">Memuat data siswa kelas binaan...</td></tr>';

      const qSiswa = query(collection(db, "users"), where("role", "==", "siswa"), where("kelas", "==", kelasBinaanAktif));
      const snapSiswa = await getDocs(qSiswa);

      const qWaliData = query(collection(db, "walikelas_catatan"), where("kelas", "==", kelasBinaanAktif));
      const snapWaliData = await getDocs(qWaliData);
      const mapWaliData = {};
      snapWaliData.forEach(d => { mapWaliData[d.data().nama_siswa] = d.data(); });

      let listSiswa = [];
      snapSiswa.forEach(docSnap => {
        listSiswa.push(docSnap.data());
      });

      listSiswa.sort((a, b) => a.nama.localeCompare(b.nama, undefined, { sensitivity: 'base' }));
      cacheListSiswaWaliClass = listSiswa;

      tbody.innerHTML = "";
      let no = 1;
      const isKelas12 = kelasBinaanAktif.toUpperCase().startsWith("XII");

      listSiswa.forEach((s, idx) => {
        const wData = mapWaliData[s.nama] || { sakit: 0, izin: 0, alpa: 0, catatan: "-", ekstra1_nama: "", ekstra1_ket: "", ekstra2_nama: "", ekstra2_ket: "", tanggapan_ortu: "", keputusan: "" };
        const dataObj = { nama: s.nama, username: s.username, nisn: s.nisn || "", kelas: s.kelas, ...wData };

        const displayNis = s.nisn ? `NIS: ${s.username} / NISN: ${s.nisn}` : `NIS: ${s.username}`;

        let strEkstraRingkas = "-";
        if (wData.ekstra1_nama) {
          strEkstraRingkas = wData.ekstra1_nama;
          if (wData.ekstra2_nama) strEkstraRingkas += `, ${wData.ekstra2_nama}`;
        }

        let tdKeputusanHtml = "";
        if (isGenap) {
          let opts = '<option value="">-- Pilih --</option>';
          if (isKelas12) {
            opts += `<option value="lulus" ${wData.keputusan === 'lulus' ? 'selected' : ''}>Lulus</option>`;
            opts += `<option value="tidak_lulus" ${wData.keputusan === 'tidak_lulus' ? 'selected' : ''}>Tidak Lulus</option>`;
          } else {
            opts += `<option value="naik" ${wData.keputusan === 'naik' ? 'selected' : ''}>Naik Kelas</option>`;
            opts += `<option value="tinggal" ${wData.keputusan === 'tinggal' ? 'selected' : ''}>Tinggal Kelas</option>`;
          }
          tdKeputusanHtml = `<td><select class="form-control sel-keputusan-inline" data-nama="${s.nama}" style="font-size:12px; padding:4px 8px;">${opts}</select></td>`;
        }

        const tr = document.createElement("tr");
        tr.innerHTML = `
          <td>${no++}</td>
          <td><b>${s.nama}</b><br><small style="color:#666;">${displayNis}</small></td>
          <td>S: <b>${wData.sakit || 0}</b> | I: <b>${wData.izin || 0}</b> | A: <b>${wData.alpa || 0}</b></td>
          <td>${strEkstraRingkas}</td>
          <td>${wData.catatan || '-'}</td>
          ${tdKeputusanHtml}
          <td style="text-align:center;">
            <div style="display:flex; gap:4px; justify-content:center; flex-wrap:wrap;">
              <button class="btn-identitas btn-identitas-siswa" title="Kelengkapan Identitas Siswa">👤 Identitas</button>
              <button class="btn-cetak-identitas btn-cetak-identitas-siswa" title="Cetak Identitas Siswa">🖨️ Cetak Identitas</button>
              <button class="btn-edit btn-edit-catatan" title="Edit Absensi & Catatan">✏️ Edit</button>
              <button class="btn-submit btn-preview-rapor" style="padding:5px 10px; font-size:12px; width:auto;" title="Cetak Lembar Rapor">📄 Rapor</button>
            </div>
          </td>
        `;

        if (isGenap) {
          const selIn = tr.querySelector('.sel-keputusan-inline');
          selIn.addEventListener('change', (e) => simpanKeputusanQuick(s.nama, s.kelas, e.target.value));
        }

        tr.querySelector('.btn-identitas-siswa').addEventListener('click', () => bukaModalIdentitasSiswa(dataObj));
        tr.querySelector('.btn-cetak-identitas-siswa').addEventListener('click', () => prosesCetakIdentitasSiswa(dataObj));
        tr.querySelector('.btn-edit-catatan').addEventListener('click', () => bukaModalCatatanWali(dataObj));
        tr.querySelector('.btn-preview-rapor').addEventListener('click', () => previewRaporSiswa(dataObj));
        tbody.appendChild(tr);
      });

      if (no === 1) {
        tbody.innerHTML = `<tr><td colspan="7" style="text-align:center;">Belum ada siswa terdaftar pada kelas <b>${kelasBinaanAktif}</b>.</td></tr>`;
      }
    }

      const reader = new FileReader();
      btn.disabled = true;
      statusDiv.innerText = "Membaca & mengunggah data Identitas...";

      reader.onload = async function(e) {
        try {
          const data = new Uint8Array(e.target.result);
          const workbook = XLSX.read(data, { type: 'array' });
          const jsonData = XLSX.utils.sheet_to_json(workbook.Sheets[workbook.SheetNames[0]]);

          let batch = writeBatch(db);
          let count = 0;

          for (let row of jsonData) {
            const namaSiswa = row.nama_siswa ? String(row.nama_siswa).trim() : "";
            if (namaSiswa) {
              const docId = `identitas_${kelasBinaanAktif}_${namaSiswa}`.replace(/\s+/g, '_');
              const refDoc = doc(db, "identitas_siswa", docId);

              batch.set(refDoc, {
                nama_siswa: namaSiswa,
                kelas: kelasBinaanAktif,
                tempat_lahir: row.tempat_lahir ? String(row.tempat_lahir).trim() : "",
                tanggal_lahir: row.tanggal_lahir ? String(row.tanggal_lahir).trim() : "",
                jenis_kelamin: row.jenis_kelamin ? String(row.jenis_kelamin).trim() : "Laki-Laki",
                agama: row.agama ? String(row.agama).trim() : "Islam",
                pendidikan_sebelumnya: row.pendidikan_sebelumnya ? String(row.pendidikan_sebelumnya).trim() : "",
                foto_url: row.foto_url ? String(row.foto_url).trim() : "",
                alamat_siswa: row.alamat_siswa ? String(row.alamat_siswa).trim() : "",

                nama_ayah: row.nama_ayah ? String(row.nama_ayah).trim() : "",
                nama_ibu: row.nama_ibu ? String(row.nama_ibu).trim() : "",
                pekerjaan_ayah: row.pekerjaan_ayah ? String(row.pekerjaan_ayah).trim() : "",
                pekerjaan_ibu: row.pekerjaan_ibu ? String(row.pekerjaan_ibu).trim() : "",
                jalan_ortu: row.jalan_ortu ? String(row.jalan_ortu).trim() : "",
                desa_ortu: row.desa_ortu ? String(row.desa_ortu).trim() : "",
                kecamatan_ortu: row.kecamatan_ortu ? String(row.kecamatan_ortu).trim() : "",
                kabupaten_ortu: row.kabupaten_ortu ? String(row.kabupaten_ortu).trim() : "",
                provinsi_ortu: row.provinsi_ortu ? String(row.provinsi_ortu).trim() : "",

                nama_wali: row.nama_wali ? String(row.nama_wali).trim() : "",
                pekerjaan_wali: row.pekerjaan_wali ? String(row.pekerjaan_wali).trim() : "",
                alamat_wali: row.alamat_wali ? String(row.alamat_wali).trim() : ""
              }, { merge: true });
              count++;

              if (count % 400 === 0) {
                await batch.commit();
                batch = writeBatch(db);
              }
            }
          }

          if (count > 0) {
            await batch.commit();
            alert(`Berhasil menyimpan data Identitas massal untuk ${count} siswa kelas ${kelasBinaanAktif}!`);
            fileInput.value = "";
            muatTabelWaliKelasSiswa();

            alert("Tidak ada data siswa valid dalam file Excel.");
          }
        } catch (err) { alert("Gagal import identitas: " + err.message); } 
        finally { btn.disabled = false; statusDiv.innerText = ""; }
      };
      reader.readAsArrayBuffer(fileInput.files[0]);
    };

    window.simpanSemuaNilaiKolektif = async function() {
      const mapel = document.getElementById("guru-select-mapel-nilai").value;
      const kelas = document.getElementById("guru-select-kelas-nilai").value;

      if(cacheListSiswaNilai.length === 0) return;

      if(confirm(`Apakah Anda yakin ingin menyimpan seluruh nilai (${cacheListSiswaNilai.length} siswa) kelas ${kelas}?`)) {
        let batch = writeBatch(db);
        let count = 0;

        for(let i = 0; i < cacheListSiswaNilai.length; i++) {
          const indexRow = i + 1;
          const namaSiswa = cacheListSiswaNilai[i];
          const nilai = document.getElementById(`nilai-${indexRow}`).value;
          const tpTinggi = document.getElementById(`tphigh-${indexRow}`).value;
          const tpRendah = document.getElementById(`tplow-${indexRow}`).value;

          if(nilai !== "") {
            const docId = `${mapel}_${kelas}_${namaSiswa}`.replace(/\s+/g, '_');
            const refDoc = doc(db, "nilai_mapel", docId);
            batch.set(refDoc, {
              mapel: mapel, kelas: kelas, nama_siswa: namaSiswa,
              nilai: Number(nilai), tp_tinggi: tpTinggi, tp_rendah: tpRendah, guru: currentUser.nama
            });
            count++;

            if (count % 400 === 0) {
              await batch.commit();
              batch = writeBatch(db);
            }
          }
        }

        if(count > 0) {
          await batch.commit();
          alert(`Berhasil menyimpan ${count} nilai siswa secara massal!`);
        } else {
          alert("Belum ada nilai yang diisi pada tabel!");
        }
      }
    };

    window.generateLegerNilaiKelas = async function() {
      const kelas = document.getElementById("waka-select-kelas-leger").value;
      const container = document.getElementById("container-tabel-leger");

      if (!kelas) {
        container.innerHTML = '<p style="text-align:center; color:#666; padding:20px;">Silakan pilih kelas terlebih dahulu.</p>';
        return;
      }

      container.innerHTML = '<p style="text-align:center; color:#1a73e8; padding:20px;">Memuat leger rekapitulasi nilai...</p>';

      const qSiswa = query(collection(db, "users"), where("role", "==", "siswa"), where("kelas", "==", kelas));
      const snapSiswa = await getDocs(qSiswa);
      const daftarSiswa = [];
      snapSiswa.forEach(d => daftarSiswa.push(d.data()));

      daftarSiswa.sort((a, b) => a.nama.localeCompare(b.nama, undefined, { sensitivity: 'base' }));

      const snapMapel = await getDocs(collection(db, "mapel"));
      const daftarMapel = [];
      snapMapel.forEach(d => daftarMapel.push(d.data()));

      const qNilai = query(collection(db, "nilai_mapel"), where("kelas", "==", kelas));
      const snapNilai = await getDocs(qNilai);
      const mapNilai = {};
      snapNilai.forEach(d => {
        const data = d.data();
        mapNilai[`${data.nama_siswa}_${data.mapel}`] = data.nilai;
      });

      if (daftarSiswa.length === 0) {
        container.innerHTML = `<p style="text-align:center; color:#ef4444; padding:20px;">Belum ada siswa terdaftar pada kelas <b>${kelas}</b>.</p>`;
        return;
      }

      const rekapSiswa = daftarSiswa.map(s => {
        let total = 0; let count = 0;
        const nilaiPerMapel = {};

        daftarMapel.forEach(m => {
          const val = mapNilai[`${s.nama}_${m.nama}`];
          if (val !== undefined && val !== null && val !== "") {
            nilaiPerMapel[m.nama] = Number(val);
            total += Number(val);
            count++;
          } else {
            nilaiPerMapel[m.nama] = "-";
          }
        });

        const rataRata = count > 0 ? (total / count).toFixed(1) : 0;
        return { nama: s.nama, nilaiMapel: nilaiPerMapel, total, rataRata: Number(rataRata) };
      });

      const sortedSiswa = [...rekapSiswa].sort((a, b) => b.rataRata - a.rataRata);
      rekapSiswa.forEach(s => {
        s.rank = sortedSiswa.findIndex(x => x.nama === s.nama) + 1;
      });

      let thMapel = daftarMapel.map(m => `<th>${m.kode}</th>`).join("");
      let rows = rekapSiswa.map((s, idx) => {
        let tdMapel = daftarMapel.map(m => `<td>${s.nilaiMapel[m.nama]}</td>`).join("");
        return `
          <tr>
            <td>${idx + 1}</td>
            <td><b>${s.nama}</b></td>
            ${tdMapel}
            <td><b>${s.total}</b></td>
            <td><b>${s.rataRata}</b></td>
            <td><span class="badge-role">${s.rank}</span></td>
          </tr>
        `;
      }).join("");

      container.innerHTML = `
        <table id="tabel-leger-cetak">
          <thead>
            <tr>
              <th>No</th>
              <th>Nama Siswa</th>
              ${thMapel}
              <th>Total</th>
              <th>Rata-Rata</th>
              <th>Rank</th>
            </tr>
          </thead>
          <tbody>${rows}</tbody>
        </table>
      `;
    };

    window.prosesImportExcel = function() {
      const fileInput = document.getElementById("file-excel");
      const statusDiv = document.getElementById("status-import");
      const btn = document.getElementById("btn-import");
      if (!fileInput.files.length) { alert("Silakan pilih file!"); return; }

      const reader = new FileReader();
      btn.disabled = true;
      statusDiv.innerText = "Membaca file...";

      reader.onload = async function(e) {
        try {
          const data = new Uint8Array(e.target.result);
          const workbook = XLSX.read(data, { type: 'array' });
          const jsonData = XLSX.utils.sheet_to_json(workbook.Sheets[workbook.SheetNames[0]]);

          let batch = writeBatch(db);
          let count = 0;

          for (let row of jsonData) {
            const usr = row['username/NIS'] !== undefined ? row['username/NIS'] : row.username;

            if (row.nama && usr !== undefined && row.password && row.role) {
              batch.set(doc(collection(db, "users")), {
                nama: String(row.nama).trim(),
                username: String(usr).trim(),
                password: String(row.password).trim(),
                role: String(row.role).toLowerCase().trim(),
                kelas: row.kelas ? String(row.kelas).trim() : "",
                nisn: row.nisn ? String(row.nisn).trim() : ""
              });
              count++;
              
              if (count % 400 === 0) { 
                await batch.commit(); 
                batch = writeBatch(db); 
              }
            }
          }
          if (count > 0) { 
            await batch.commit(); 
            alert(`Berhasil mengimpor ${count} akun!`); 
            fileInput.value = ""; 
          } else { 
            alert("Tidak ada data akun valid yang dapat diimpor."); 
          }
        } catch (err) { alert("Gagal: " + err.message); } 
        finally { btn.disabled = false; statusDiv.innerText = ""; }
      };
      reader.readAsArrayBuffer(fileInput.files[0]);
    };

    function muatTabelUsersTerkelompok() {
      onSnapshot(collection(db, "users"), (snapshot) => {
        const roles = ['guru', 'siswa', 'walimurid'];
        const dataGroup = { guru: [], siswa: [], walimurid: [] };

        snapshot.forEach((docSnap) => {
          const u = docSnap.data();
          let r = u.role ? u.role.toLowerCase() : '';
          if (r === 'waka' || r === 'walikelas' || r === 'gurumapel') r = 'guru';
          if(dataGroup[r]) {
            dataGroup[r].push({ id: docSnap.id, ...u });
          }
        });

        roles.forEach(r => {
          const tbody = document.getElementById(`tabel-users-${r}`);
          if(!tbody) return;
          tbody.innerHTML = "";
          let no = 1;

          if(dataGroup[r].length === 0) {
            const colspan = r === 'siswa' ? 8 : (r === 'guru' ? 7 : 6);
            tbody.innerHTML = `<tr><td colspan="${colspan}" style="text-align:center;">Belum ada akun ${r}.</td></tr>`;
            return;
          }

          dataGroup[r].sort((a, b) => a.nama.localeCompare(b.nama, undefined, { sensitivity: 'base' }));

          dataGroup[r].forEach(u => {
            const tr = document.createElement("tr");

            if(r === 'siswa') {
              tr.innerHTML = `
                <td><input type="checkbox" class="chk-${r}" value="${u.id}"></td>
                <td>${no++}</td>
                <td><b>${u.nama}</b></td>
                <td>${u.username}</td>
                <td>${u.nisn || '-'}</td>
                <td>${u.password}</td>
                <td><b>${u.kelas || '-'}</b></td>
                <td><button class="btn-edit btn-edit-user">✏️ Edit</button></td>
              `;
            } else if(r === 'guru') {
              tr.innerHTML = `
                <td><input type="checkbox" class="chk-${r}" value="${u.id}"></td>
                <td>${no++}</td>
                <td><b>${u.nama}</b></td>
                <td>${u.username}</td>
                <td>${u.password}</td>
                <td><span class="badge-role">${u.role}</span></td>
                <td><button class="btn-edit btn-edit-user">✏️ Edit</button></td>
              `;
            } else {
              tr.innerHTML = `
                <td><input type="checkbox" class="chk-${r}" value="${u.id}"></td>
                <td>${no++}</td>
                <td><b>${u.nama}</b></td>
                <td>${u.username}</td>
                <td>${u.password}</td>
                <td><button class="btn-edit btn-edit-user">✏️ Edit</button></td>
              `;
            }

            tr.querySelector('.btn-edit-user').addEventListener('click', () => bukaModalEdit(u));
            tbody.appendChild(tr);
          });
        });
      });
    }

    window.bukaModalEdit = function(user) {
      document.getElementById("edit-doc-id").value = user.id;
      document.getElementById("edit-nama").value = user.nama;
      document.getElementById("edit-role").value = user.role.toLowerCase();
      document.getElementById("edit-username").value = user.username;
      document.getElementById("edit-password").value = user.password;

      toggleFieldEditUser();

      if (user.role.toLowerCase() === "siswa") {
        document.getElementById("edit-nisn").value = user.nisn || "";
        document.getElementById("edit-kelas").value = user.kelas || "";
      }

      document.getElementById("modal-edit-user").style.display = "flex";
    };

    window.tutupModalEdit = function() {
      document.getElementById("modal-edit-user").style.display = "none";
    };

    window.simpanPerubahanUser = async function(e) {
      e.preventDefault();
      const docId = document.getElementById("edit-doc-id").value;
      const role = document.getElementById("edit-role").value;

      const updateData = {
        nama: document.getElementById("edit-nama").value.trim(),
        role: role,
        username: String(document.getElementById("edit-username").value).trim(),
        password: String(document.getElementById("edit-password").value).trim()
      };

      if (role === "siswa") {
        updateData.nisn = String(document.getElementById("edit-nisn").value).trim();
        updateData.kelas = document.getElementById("edit-kelas").value;
      } else {
        updateData.nisn = "";
        updateData.kelas = "";
      }

      try {
        await updateDoc(doc(db, "users", docId), updateData);
        alert("Data akun berhasil diperbarui!");
        tutupModalEdit();
      } catch (err) { alert("Gagal memperbarui: " + err.message); }
    };

    window.toggleSelectAll = function(role, masterCheckbox) {
      document.querySelectorAll(`.chk-${role}`).forEach(cb => cb.checked = masterCheckbox.checked);
    };

    window.hapusMultipleUser = async function(role) {
      const selected = document.querySelectorAll(`.chk-${role}:checked`);
      if(selected.length === 0) { alert("Pilih minimal satu akun yang ingin dihapus!"); return; }
      if(confirm(`Hapus ${selected.length} akun terpilih?`)) {
        let batch = writeBatch(db);
        let count = 0;
        selected.forEach(cb => { 
          batch.delete(doc(db, "users", cb.value)); 
          count++; 
        });
        if(count > 0) { await batch.commit(); alert(`Berhasil menghapus ${count} akun!`); }
      }
    };

    window.logout = function() {
      document.getElementById("form-login").reset();
      document.getElementById("err-login").innerText = "";
      document.getElementById("screen-dashboard").classList.remove("active");
      document.getElementById("screen-login").classList.add("active");
    };
  </script>
